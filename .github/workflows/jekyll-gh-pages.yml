name: Publish demo manually
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source branch, tag or commit to publish
        required: true
        default: main
        type: string
permissions:
  contents: read
concurrency:
  group: publish-demo
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository_owner == 'Arranger-Development' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Require dedicated publishing credential
        env:
          PAGES_DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
        run: |
          if [ -z "$PAGES_DEPLOY_KEY" ]; then
            echo 'Configure the repository-specific PAGES_DEPLOY_KEY secret before publishing.'
            exit 1
          fi
      - name: Checkout trusted release checks
        uses: actions/checkout@v4
        with:
          ref: main
          path: tooling
          persist-credentials: false
      - name: Checkout source version
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install and build
        working-directory: source
        env:
          VITE_BASE_PATH: /arranger-demo/
        run: |
          npm ci
          npm run build
      - name: Check publishable files
        run: python3 tooling/.github/scripts/check-pages-artifact.py source/dist arranger-demo
      - name: Checkout public publishing repository
        uses: actions/checkout@v4
        with:
          repository: Project-Arranger/arranger-demo
          ref: main
          path: publishing
          ssh-key: ${{ secrets.PAGES_DEPLOY_KEY }}
      - name: Replace site with checked output
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          target=Path('publishing/site')
          if target.exists(): shutil.rmtree(target)
          shutil.copytree('source/dist',target)
          PY
      - name: Publish site files
        working-directory: publishing
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- site
          if git diff --cached --quiet; then
            git push --dry-run origin HEAD:main
            echo 'This version is already published.'
            exit 0
          fi
          git commit -m 'Publish demo'
          git push origin HEAD:main
