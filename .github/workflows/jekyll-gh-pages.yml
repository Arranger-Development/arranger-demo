name: Publish approved demo externally

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Full release/development-pages commit SHA already accepted on Development Pages
        required: true
        type: string
      confirmation:
        description: Enter PUBLISH only after explicit approval to update the external demo
        required: true
        type: string

permissions:
  contents: read
  deployments: read

concurrency:
  group: publish-external-demo
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Arranger-Development/arranger-demo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit approval and pinned release
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          PAGES_DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
        run: |
          test "$CONFIRMATION" = 'PUBLISH'
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test -n "$PAGES_DEPLOY_KEY"
      - name: Checkout trusted release checks
        uses: actions/checkout@v4
        with:
          ref: main
          path: tooling
          persist-credentials: false
      - name: Checkout accepted release
        uses: actions/checkout@v4
        with:
          ref: release/development-pages
          fetch-depth: 0
          path: release
          persist-credentials: false
      - name: Verify and extract accepted release
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git -C release merge-base --is-ancestor "$RELEASE_COMMIT" HEAD
          mkdir dist
          git -C release archive "$RELEASE_COMMIT" | tar -x -C dist
          python3 tooling/.github/scripts/check-pages-artifact.py dist arranger-demo
          python3 tooling/.github/scripts/verify-preview-release.py dist "$RELEASE_COMMIT"
      - name: Checkout external publishing repository
        uses: actions/checkout@v4
        with:
          repository: Project-Arranger/arranger-demo
          ref: main
          path: publishing
          ssh-key: ${{ secrets.PAGES_DEPLOY_KEY }}
      - name: Copy accepted files without rebuilding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          target = Path('publishing/site')
          if target.exists():
              shutil.rmtree(target)
          shutil.copytree('dist', target)
          PY
      - name: Publish external demo
        working-directory: publishing
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- site
          if git diff --cached --quiet; then
            echo 'This accepted release is already published.'
            exit 0
          fi
          git commit -m "release(pages): publish accepted preview $RELEASE_COMMIT"
          git push origin HEAD:main
